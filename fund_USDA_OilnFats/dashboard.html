    }

          if (v !== undefined && v !== null && !isNaN(v) && Math.abs(v) > 0.0001) return v;
        }
        return null;
      }

      // 8. Ratios & Percentages:
      if (row.attribute === 'SU') {
        let endRow = null;
        let demRow = null;
        if (row.group === 'BO') {
          endRow = sndData.find(r => r.group === 'BO' && r.attribute === 'Endstocks' && r.subattribute === 'SBO');
          demRow = sndData.find(r => r.group === 'BO' && r.attribute === 'Demand' && r.subattribute === 'Total Demand');
        } else if (row.group === 'SBM') {
          endRow = sndData.find(r => r.group === 'SBM' && r.attribute === 'Endstocks' && r.subattribute === 'Total SBM Stocks');
          demRow = sndData.find(r => r.group === 'SBM' && r.attribute === 'Demand' && r.subattribute === 'Total Demand');
        }
        if (endRow && demRow) {
          const endVal = calculateYearTotal(endRow, yr);
          const demVal = calculateYearTotal(demRow, yr);
          if (demVal && demVal > 0 && endVal) return (endVal / demVal) * 100.0;
        }
        return null;
      }

      if (row.attribute === 'Yield') {
        const crushRow = sndData.find(r => r.group === 'SB' && r.attribute === 'Crush');
        let prodRow = null;
        if (row.group === 'BO') {
          prodRow = sndData.find(r => r.group === 'BO' && r.attribute === 'Production' && r.subattribute === 'CBO');
        } else if (row.group === 'SBM' && row.subattribute === 'Meal') {
          prodRow = sndData.find(r => r.group === 'SBM' && r.attribute === 'Production' && r.subattribute === 'Meal');
        } else if (row.group === 'SBM' && row.subattribute === 'Hull') {
          prodRow = sndData.find(r => r.group === 'SBM' && r.attribute === 'Production' && r.subattribute === 'Hull');
        }
        let pSum = 0;
        let cSum = 0;
        for (let m = 1; m <= 12; m++) {
          const p = yr + '-' + String(m).padStart(2, '0');
          if (prodRow && prodRow.values[p]) pSum += prodRow.values[p];
          if (crushRow && crushRow.values[p]) cSum += crushRow.values[p];
        }
        if (cSum > 0 && pSum > 0) return (pSum / cSum) * 100.0;
        return null;
      }

      if (row.metric_type === 'ratio' || row.is_percent) {
        let sum = 0;
        let count = 0;
        for (let m = 1; m <= 12; m++) {
          const p = yr + '-' + String(m).padStart(2, '0');
          const v = row.values[p];
          if (v !== undefined && v !== null && !isNaN(v) && Math.abs(v) > 0.0001) {
            sum += v;
            count++;
          }
        }
        return count > 0 ? (sum / count) : null;
      }

      // 9. Standard Flow (Production, Crush, Import, Export, Consumption, Refine, EIA): Sum of all months!
      let sum = 0;
      let hasVal = false;
      for (let m = 1; m <= 12; m++) {
        const p = yr + '-' + String(m).padStart(2, '0');
        const v = row.values[p];
        if (v !== undefined && v !== null && !isNaN(v) && Math.abs(v) > 0.0001) {
          sum += v;
          hasVal = true;
        }
      }
      return hasVal ? sum : null;
    }

    // RENDER FULL S&D TIMELINE (With standardized column width - NO TRUNCATION)
    function renderSndTimeline() {
      const yearsToRender = [...selectedYears].sort();
      const mult = getUnitMultiplier(false);

      // Colgroup for fixed widths
      let colgroup = `<colgroup>
        <col class="col-grp">
        <col class="col-attr">
        <col class="col-sub">`;

      let headRow1 = `<tr>
        <th class="sticky-th-1 sticky-col-group col-grp text-left font-bold text-slate-800">Group</th>
        <th class="sticky-th-1 sticky-col-attr col-attr text-left font-bold text-slate-800">Attribute</th>
        <th class="sticky-th-1 sticky-col-sub col-sub text-left font-bold text-slate-800">SubAttribute</th>`;
      
      let headRow2 = `<tr>
        <th class="sticky-th-2 sticky-col-group col-grp"></th>
        <th class="sticky-th-2 sticky-col-attr col-attr"></th>
        <th class="sticky-th-2 sticky-col-sub col-sub"></th>`;

      yearsToRender.forEach(yr => {
        const isExp = expandedYears.has(yr);
        if (isExp) {
          months.forEach(() => { colgroup += `<col class="col-mth">`; });
          colgroup += `<col class="col-tot">`;
        } else {
          colgroup += `<col class="col-collapsed">`;
        }

        const colSpan = isExp ? 13 : 1;
        headRow1 += `
          <th colspan="${colSpan}" class="text-center font-extrabold bg-slate-200 year-border-left year-border-right py-1.5 text-slate-900">
            <div class="flex items-center justify-center gap-1.5">
              <span>${yr}</span>
              <button onclick="toggleYearExpand('${yr}')" class="text-xs px-1.5 py-0.5 rounded bg-white hover:bg-slate-100 text-blue-700 font-bold border border-slate-300 shadow-sm">
                ${isExp ? '[-]' : '[+]'}
              </button>
            </div>
          </th>`;
        if (isExp) {
          months.forEach(m => {
            headRow2 += `<th class="text-center font-medium px-2 py-1 text-slate-600 col-mth bg-slate-50">${m}</th>`;
          });
          headRow2 += `<th class="text-center font-extrabold px-2 py-1 col-tot col-total text-slate-900">Total</th>`;
        } else {
          headRow2 += `<th class="text-center font-extrabold px-2 py-1 col-collapsed col-total text-slate-700">Year</th>`;
        }
      });
      colgroup += `</colgroup>`;
      headRow1 += `</tr>`;
      headRow2 += `</tr>`;

      let bodyHtml = '';

      function buildSpacerRow(isGroupDivider) {
        const rowClass = isGroupDivider ? 'row-group-divider' : 'row-section-spacer';
        let str = `<tr class="${rowClass}">`;
        str += `<td class="sticky-col-group col-grp"></td>`;
        str += `<td class="sticky-col-attr col-attr"></td>`;
        str += `<td class="sticky-col-sub col-sub"></td>`;
        yearsToRender.forEach(yr => {
          const isExp = expandedYears.has(yr);
          if (isExp) {
            for (let i = 0; i < 12; i++) {
              const isFirstM = (i === 0) ? 'year-border-left' : '';
              str += `<td class="col-mth ${isFirstM}"></td>`;
            }
            str += `<td class="col-tot col-total"></td>`;
          } else {
            str += `<td class="col-collapsed col-total year-border-left year-border-right"></td>`;
          }
        });
        str += `</tr>`;
        return str;
      }

      const visibleRows = sndData.filter(r => selectedGroups.has(r.group));

      visibleRows.forEach((row, rIdx) => {
        // Visual Hierarchy Classes
        let rowClass = 'hover:bg-slate-100/60';
        let subPrefix = '';

        if (row.row_type === 'sub_cons') {
          rowClass += ' row-sub-cons';
          subPrefix = '<span class="text-amber-500 font-mono mr-1">↳</span> ';
        } else if (row.row_type === 'cons_total') {
          rowClass += ' row-cons-total';
        } else if (row.row_type === 'sub_cbo') {
          rowClass += ' row-sub-cbo';
          subPrefix = '<span class="text-slate-400 font-mono mr-1">↳</span> ';
        } else if (row.row_type === 'cbo_total') {
          rowClass += ' row-cbo-total';
        } else if (row.row_type === 'rbo_standalone') {
          rowClass += ' row-rbo-standalone';
        } else if (row.row_type === 'sbo_grand_total') {
          rowClass += ' row-sbo-grand-total';
        } else if (row.row_type === 'sub_meal' || row.row_type === 'sub_meal_st') {
          rowClass += ' row-sub-meal';
          subPrefix = '<span class="text-orange-500 font-mono mr-1">↳</span> ';
        } else if (row.row_type === 'meal_total') {
          rowClass += ' row-meal-total';
        } else if (row.row_type === 'major_total' || row.row_type === 'group_total') {
          rowClass += ' row-major-total';
        }

        const badgeClass = row.group === 'SB' ? 'badge-sb' : (row.group === 'BO' ? 'badge-bo' : 'badge-sbm');

        let tr = `<tr class="${rowClass}">`;
        tr += `<td class="text-left font-bold sticky-col-group col-grp"><span class="px-1.5 py-0.5 rounded text-[10px] ${badgeClass}">${row.group}</span></td>`;
        tr += `<td class="text-left font-semibold sticky-col-attr col-attr">${row.attribute}</td>`;
        tr += `<td class="text-left sticky-col-sub col-sub">${subPrefix}${row.subattribute}</td>`;

        const rowMult = row.is_percent ? 1.0 : mult;

        yearsToRender.forEach(yr => {
          const isExp = expandedYears.has(yr);

          const monthCells = months.map((m, mIdx) => {
            const pKey = yr + '-' + String(mIdx + 1).padStart(2, '0');
            const rawVal = row.values[pKey];
            if (rawVal !== undefined && rawVal !== null && !isNaN(rawVal) && Math.abs(rawVal) > 0.000001) {
              return formatVal(rawVal * rowMult, row.is_percent);
            }
            return '-';
          });

          const yrVal = calculateYearTotal(row, yr);
          const yrDisplay = (yrVal !== null && yrVal !== undefined) ? formatVal(yrVal * rowMult, row.is_percent) : '-';

          if (isExp) {
            monthCells.forEach((c, cIdx) => {
              const isFirstM = cIdx === 0 ? 'year-border-left' : '';
              tr += `<td class="px-2 py-1 text-right col-mth ${isFirstM}">${c}</td>`;
            });
            tr += `<td class="px-2 py-1 text-right col-tot col-total">${yrDisplay}</td>`;
          } else {
            tr += `<td class="px-2 py-1 text-right col-collapsed col-total year-border-left year-border-right">${yrDisplay}</td>`;
          }
        });

        tr += `</tr>`;
        bodyHtml += tr;

        // Visual Section Spacer and Group Divider insertion
        const isSupplyEnd = (row.attribute === 'Supply' && row.subattribute === 'Total Supply');
        const isDemandEnd = (row.attribute === 'Demand' && row.subattribute === 'Total Demand') || 
                            (row.group === 'SB' && row.attribute === 'Export');
        const nextRow = visibleRows[rIdx + 1];
        const isGroupEnd = nextRow && (nextRow.group !== row.group);

        if (isGroupEnd) {
          bodyHtml += buildSpacerRow(true); // Prominent divider between SB, BO, SBM
        } else if (isSupplyEnd) {
          bodyHtml += buildSpacerRow(false); // Clean row space between Supply and Demand
        } else if (isDemandEnd) {
          bodyHtml += buildSpacerRow(false); // Clean row space between Demand and Endstocks
        }
      });

      return `
        <div class="table-container mb-6">
          <table class="data-table">
            ${colgroup}
            <thead>${headRow1}${headRow2}</thead>
            <tbody>${bodyHtml}</tbody>
          </table>
        </div>
      `;
    }

    // RENDER SEASONALITY CHART TAB
    function renderSeasonalityTab() {
      const yearsList = [...allYears].sort().reverse();
      
      let metricOptionsHtml = '';
      sndData.forEach(r => {
        const key = `${r.group}|${r.attribute}|${r.subattribute}`;
        const selected = (key === selectedSeasonalityMetric) ? 'selected' : '';
        metricOptionsHtml += `<option value="${key}" ${selected}>${r.group} - ${r.attribute} (${r.subattribute})</option>`;
      });

      let yearCheckboxesHtml = '';
      yearsList.forEach(yr => {
        const isChecked = chartSelectedYears.has(yr) ? 'checked' : '';
        const isCurrent = (yr === '2026') ? 'text-blue-700 font-extrabold' : 'text-slate-700 font-semibold';
        yearCheckboxesHtml += `
          <label class="checkbox-lbl">
            <input type="checkbox" value="${yr}" onchange="handleChartYearToggle(this)" ${isChecked}>
            <span class="${isCurrent}">${yr}</span>
          </label>
        `;
      });

      return `
        <div class="space-y-4">
          <!-- Seasonality Controls -->
          <div class="bg-white border-2 border-slate-300 rounded-lg p-4 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
            <div class="md:col-span-1">
              <label class="block text-xs font-bold text-slate-700 mb-1">Select Metric to Plot Seasonality:</label>
              <select id="seasonality-metric" onchange="handleMetricChange(this.value)" class="w-full text-xs font-semibold p-2 border-2 border-slate-300 rounded bg-slate-50 focus:border-blue-500 focus:outline-none">
                ${metricOptionsHtml}
              </select>
            </div>
            <div class="md:col-span-2">
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-slate-700">Years to Plot in Graph:</span>
                <div class="space-x-2 text-[10px]">
                  <button class="text-blue-600 hover:underline font-bold" onclick="selectChartYears('last5')">Last 5 Years</button>
                  <span class="text-gray-400">|</span>
                  <button class="text-blue-600 hover:underline font-bold" onclick="selectChartYears('all')">All Years</button>
                  <span class="text-gray-400">|</span>
                  <button class="text-gray-500 hover:underline font-bold" onclick="selectChartYears('none')">None</button>
                </div>
              </div>
              <div class="flex flex-wrap gap-3 py-1">
                ${yearCheckboxesHtml}
              </div>
            </div>
          </div>

          <!-- Chart Canvas Container -->
          <div class="bg-white border-2 border-slate-300 rounded-lg p-4 shadow-sm">
            <div class="flex justify-between items-center mb-2 border-b pb-2">
              <h3 id="chart-title" class="font-extrabold text-base text-slate-900"></h3>
              <span class="text-xs px-2.5 py-0.5 rounded font-bold bg-blue-100 text-blue-800 border border-blue-300" id="chart-unit-badge">${currentUnit}</span>
            </div>
            <div class="relative h-[420px] w-full">
              <canvas id="seasonalityCanvas"></canvas>
            </div>
          </div>

          <!-- Seasonality Summary Table -->
          <div class="bg-white border-2 border-slate-300 rounded-lg p-4 shadow-sm table-container">
            <h4 class="font-bold text-xs text-slate-800 mb-2">Monthly Seasonality Statistics (${currentUnit})</h4>
            <div id="seasonality-table-container"></div>
          </div>
        </div>
      `;
    }

    function handleMetricChange(val) {
      selectedSeasonalityMetric = val;
      renderChart();
    }

    function handleChartYearToggle(cb) {
      if (cb.checked) chartSelectedYears.add(cb.value);
      else chartSelectedYears.delete(cb.value);
      renderChart();
    }

    function selectChartYears(type) {
      chartSelectedYears.clear();
      document.querySelectorAll('#content-container input[type="checkbox"]').forEach(cb => {
        if (type === 'all') {
          cb.checked = true;
          chartSelectedYears.add(cb.value);
        } else if (type === 'last5') {
          const isL5 = allYears.slice(-5).includes(cb.value);
          cb.checked = isL5;
          if (isL5) chartSelectedYears.add(cb.value);
        } else {
          cb.checked = false;
        }
      });
      renderChart();
    }

    function renderChart() {
      const canvas = document.getElementById('seasonalityCanvas');
      if (!canvas) return;

      const [grp, attr, subattr] = selectedSeasonalityMetric.split('|');
      const row = sndData.find(r => r.group === grp && r.attribute === attr && r.subattribute === subattr);
      if (!row) return;

      const titleEl = document.getElementById('chart-title');
      const unitEl = document.getElementById('chart-unit-badge');
      if (titleEl) titleEl.innerText = `${grp} - ${attr} (${subattr}) Monthly Seasonality`;
      if (unitEl) unitEl.innerText = row.is_percent ? '%' : currentUnit;

      const mult = row.is_percent ? 1.0 : getUnitMultiplier(false);

      // Color Palette for Years
      const yearColors = {
        '2026': { stroke: '#dc2626', width: 3.5, dash: [] },       // Current: Strong Crimson
        '2025': { stroke: '#2563eb', width: 2.5, dash: [] },       // Blue
        '2024': { stroke: '#16a34a', width: 2.2, dash: [] },       // Green
        '2023': { stroke: '#ea580c', width: 2.0, dash: [] },       // Orange
        '2022': { stroke: '#9333ea', width: 2.0, dash: [] },       // Purple
        '2021': { stroke: '#0891b2', width: 2.0, dash: [] },       // Cyan
        '2020': { stroke: '#4f46e5', width: 1.8, dash: [4, 4] },   // Indigo
        '2019': { stroke: '#d97706', width: 1.8, dash: [4, 4] },   // Amber
        '2018': { stroke: '#64748b', width: 1.8, dash: [4, 4] },   // Slate
        '2017': { stroke: '#a855f7', width: 1.5, dash: [2, 2] },
        '2016': { stroke: '#14b8a6', width: 1.5, dash: [2, 2] },
        '2015': { stroke: '#94a3b8', width: 1.5, dash: [2, 2] }
      };

      // Calculate monthly Min, Max, 5-Yr Avg
      // Calculate monthly Min, Max, 5-Yr Avg (strictly ignoring 0 and empty/unreleased values)
      const monthlyValues = months.map((m, mIdx) => {
        const mStr = String(mIdx + 1).padStart(2, '0');
        const vals = [];
        allYears.forEach(y => {
          const v = row.values[`${y}-${mStr}`];
          // Exclude undefined, null, NaN, and 0 (or close to 0)
          if (v !== undefined && v !== null && !isNaN(v) && Math.abs(v) > 0.000001) {
            vals.push({ year: y, val: v * mult });
          }
        });
        return vals;
      });

      const minData = [];
      const maxData = [];
      const avg5Data = [];
      const recent5Years = allYears.slice(-5);

      months.forEach((m, mIdx) => {
        const vals = monthlyValues[mIdx];
        if (vals.length > 0) {
          const numVals = vals.map(x => x.val);
          minData.push(Math.min(...numVals));
          maxData.push(Math.max(...numVals));
          
          const recentVals = vals.filter(x => recent5Years.includes(x.year)).map(x => x.val);
          const avg = recentVals.length > 0 ? (recentVals.reduce((a, b) => a + b, 0) / recentVals.length) : null;
          avg5Data.push(avg);
        } else {
          minData.push(null);
          maxData.push(null);
          avg5Data.push(null);
        }
      });

      // Datasets
      const datasets = [];

      // 1. Min-Max Shaded Range Envelope
      datasets.push({
        label: 'Historical Max',
        data: maxData,
        borderColor: 'rgba(203, 213, 225, 0.4)',
        backgroundColor: 'rgba(241, 245, 249, 0.7)',
        fill: '+1',
        pointRadius: 0,
        borderWidth: 1,
        spanGaps: false,
        tension: 0.2
      });
      datasets.push({
        label: 'Historical Min',
        data: minData,
        borderColor: 'rgba(203, 213, 225, 0.4)',
        backgroundColor: 'transparent',
        fill: false,
        pointRadius: 0,
        borderWidth: 1,
        spanGaps: false,
        tension: 0.2
      });

      // 2. 5-Year Average Line
      datasets.push({
        label: '5-Yr Average',
        data: avg5Data,
        borderColor: '#475569',
        borderDash: [6, 4],
        borderWidth: 2.2,
        pointRadius: 3,
        pointBackgroundColor: '#475569',
        fill: false,
        spanGaps: false,
        tension: 0.2
      });

      // 3. Year Series
      const sortedChartYears = [...chartSelectedYears].sort();
      sortedChartYears.forEach(yr => {
        const yrData = months.map((m, mIdx) => {
          const pKey = `${yr}-${String(mIdx + 1).padStart(2, '0')}`;
          const v = row.values[pKey];
          // Exclude 0, empty or unreleased future data points
          return (v !== undefined && v !== null && !isNaN(v) && Math.abs(v) > 0.000001) ? v * mult : null;
        });

        const styling = yearColors[yr] || { stroke: '#64748b', width: 2, dash: [] };
        datasets.push({
          label: (yr === '2026') ? `${yr} (Current)` : yr,
          data: yrData,
          borderColor: styling.stroke,
          backgroundColor: styling.stroke,
          borderWidth: styling.width,
          borderDash: styling.dash,
          pointRadius: (yr === '2026') ? 5 : 3.5,
          pointHoverRadius: 7,
          fill: false,
          spanGaps: false,
          tension: 0.2
        });
      });

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(canvas, {
        type: 'line',
        data: {
          labels: months,
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: {
              position: 'top',
              labels: { boxWidth: 14, font: { size: 11, weight: 'bold' } }
            },
            tooltip: {
              filter: function(tooltipItem) {
                return tooltipItem.parsed.y !== null && tooltipItem.parsed.y !== undefined && Math.abs(tooltipItem.parsed.y) > 0.000001;
              },
              callbacks: {
                label: function(ctx) {
                  const v = ctx.parsed.y;
                  if (v === null || v === undefined || Math.abs(v) <= 0.000001) return null;
                  return `${ctx.dataset.label}: ${formatVal(v, row.is_percent)}`;
                }
              }
            }
          },
          scales: {
            y: {
              grid: { color: '#e2e8f0' },
              ticks: {
                font: { size: 11, weight: '600' },
                callback: function(v) { return formatVal(v, row.is_percent); }
              }
            },
            x: {
              grid: { color: '#f1f5f9' },
              ticks: { font: { size: 11, weight: 'bold' } }
            }
          }
        }
      });

      // Populate seasonality summary table
      renderSeasonalityTable(row, mult, avg5Data, minData, maxData, monthlyValues);
    }

    function renderSeasonalityTable(row, mult, avg5Data, minData, maxData, monthlyValues) {
      const container = document.getElementById('seasonality-table-container');
      if (!container) return;

      let html = `<table class="data-table text-xs">
        <thead>
          <tr class="bg-slate-100 text-slate-800">
            <th class="p-1.5 text-left font-bold sticky-th-1">Metric</th>
            ${months.map(m => `<th class="p-1.5 text-center font-bold sticky-th-1">${m}</th>`).join('')}
          </tr>
        </thead>
        <tbody>`;

      // 5-Yr Avg Row
      html += `<tr class="bg-slate-50 font-bold"><td class="p-1.5 text-left text-slate-700">5-Year Average</td>`;
      avg5Data.forEach(v => { html += `<td class="p-1.5 text-right font-bold text-slate-800">${formatVal(v, row.is_percent)}</td>`; });
      html += `</tr>`;

      // Min Row
      html += `<tr><td class="p-1.5 text-left text-blue-700 font-semibold">Historical Min</td>`;
      minData.forEach((v, idx) => {
        const match = monthlyValues[idx].find(x => Math.abs(x.val - v) < 0.1);
        const yrLabel = match ? ` (${match.year})` : '';
        html += `<td class="p-1.5 text-right text-blue-800 font-semibold">${formatVal(v, row.is_percent)}<span class="text-[9px] text-gray-500">${yrLabel}</span></td>`;
      });
      html += `</tr>`;

      // Max Row
      html += `<tr><td class="p-1.5 text-left text-red-700 font-semibold">Historical Max</td>`;
      maxData.forEach((v, idx) => {
        const match = monthlyValues[idx].find(x => Math.abs(x.val - v) < 0.1);
        const yrLabel = match ? ` (${match.year})` : '';
        html += `<td class="p-1.5 text-right text-red-800 font-semibold">${formatVal(v, row.is_percent)}<span class="text-[9px] text-gray-500">${yrLabel}</span></td>`;
      });
      html += `</tr>`;

      // 2026 Current Row
      html += `<tr class="bg-blue-50/70 font-extrabold border-t-2 border-blue-400"><td class="p-1.5 text-left text-blue-900 font-extrabold">2026 (Current)</td>`;
      months.forEach((m, mIdx) => {
        const pKey = `2026-${String(mIdx + 1).padStart(2, '0')}`;
        const v = row.values[pKey];
        if (v !== undefined && v !== null && !isNaN(v) && Math.abs(v) > 0.000001) {
          html += `<td class="p-1.5 text-right font-extrabold text-blue-900">${formatVal(v * mult, row.is_percent)}</td>`;
        } else {
          html += `<td class="p-1.5 text-right text-gray-400 font-normal">-</td>`;
        }
      });
      html += `</tr>`;

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    // RENDER GENERIC MATRIX (For BO, SBM, SB tabs)
    function renderCategoryTab(groupFilter) {
      const yearsToRender = [...selectedYears].sort().reverse();
      const mult = getUnitMultiplier(false);
      const filtered = sndData.filter(r => r.group === groupFilter);

      let html = `<div class="grid grid-cols-1 gap-6">`;
      filtered.forEach(row => {
        const rowMult = row.is_percent ? 1.0 : mult;
        const unitLabel = row.is_percent ? '%' : currentUnit;

        html += `
          <div class="bg-white border-2 border-slate-300 rounded-lg p-3 shadow-sm table-container">
            <div class="flex justify-between items-center mb-2 px-1">
              <h3 class="font-extrabold text-sm text-slate-800">${row.group} - ${row.attribute} (${row.subattribute})</h3>
              <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-bold border border-slate-300">${unitLabel}</span>
            </div>
            <table class="data-table">
              <colgroup>
                <col class="col-grp">
                ${months.map(() => `<col class="col-mth">`).join('')}
                <col class="col-tot">
              </colgroup>
              <thead>
                <tr class="bg-slate-100 text-slate-800">
                  <th class="text-left font-bold p-1.5 col-grp sticky-th-1">Year</th>
                  ${months.map(m => `<th class="p-1.5 text-center font-bold col-mth sticky-th-1">${m}</th>`).join('')}
                  <th class="p-1.5 text-right font-extrabold col-tot sticky-th-1 col-total">${row.metric_type === 'stock' ? 'End' : 'Total'}</th>
                </tr>
              </thead>
              <tbody>
        `;

        yearsToRender.forEach(yr => {
          let tr = `<tr class="hover:bg-slate-50"><td class="text-left font-bold p-1.5 bg-slate-50 col-grp">${yr}</td>`;
          months.forEach((m, mIdx) => {
            const pKey = yr + '-' + String(mIdx + 1).padStart(2, '0');
            const v = row.values[pKey];
            if (v !== undefined && v !== null && !isNaN(v) && Math.abs(v) > 0.000001) {
              tr += `<td class="p-1.5 text-right col-mth">${formatVal(v * rowMult, row.is_percent)}</td>`;
            } else {
              tr += `<td class="p-1.5 text-right text-gray-400 col-mth">-</td>`;
            }
          });

          const yrVal = calculateYearTotal(row, yr);
          const totalVal = (yrVal !== null && yrVal !== undefined) ? formatVal(yrVal * rowMult, row.is_percent) : '-';

          tr += `<td class="p-1.5 text-right font-extrabold col-tot col-total">${totalVal}</td></tr>`;
          html += tr;
        });

        html += `</tbody></table></div>`;
      });
      html += `</div>`;
      return html;
    }

    // RENDER REGIONAL CRUSH
    function renderRegionalTab() {
      const mult = currentUnit === 'MT' ? 0.90718474 : (currentUnit === 'TONS' ? 1.0 : 2000.0);
      const regions = [...new Set(regionalData.map(r => r.region))].sort();
      const metrics = [...new Set(regionalData.map(r => r.metric))];
      const yearsToRender = [...selectedYears].sort().reverse();

      let html = `<div class="space-y-6">`;
      metrics.forEach(met => {
        html += `
          <div class="bg-white border-2 border-slate-300 rounded-lg p-3 shadow-sm table-container">
            <h3 class="font-extrabold text-sm mb-2 text-slate-800 px-1">${met} by Region (${currentUnit})</h3>
            <table class="data-table">
              <colgroup>
                <col style="width: 140px; min-width: 140px;">
                <col class="col-grp">
                ${months.map(() => `<col class="col-mth">`).join('')}
                <col class="col-tot">
              </colgroup>
              <thead>
                <tr class="bg-slate-100 text-slate-800">
                  <th class="text-left font-bold p-1.5 sticky-th-1">Region</th>
                  <th class="text-left font-bold p-1.5 sticky-th-1">Year</th>
                  ${months.map(m => `<th class="p-1.5 text-center font-bold sticky-th-1">${m}</th>`).join('')}
                  <th class="p-1.5 text-right font-extrabold sticky-th-1 col-total">Total</th>
                </tr>
              </thead>
              <tbody>
        `;
        regions.forEach(reg => {
          yearsToRender.forEach((yr, yIdx) => {
            let tr = `<tr class="hover:bg-slate-50">`;
            if (yIdx === 0) tr += `<td rowspan="${yearsToRender.length}" class="text-left font-bold p-1.5 bg-slate-50 border-r-2 border-slate-400 align-top">${reg}</td>`;
            tr += `<td class="text-left font-semibold p-1.5 bg-slate-50/50">${yr}</td>`;

            let sum = 0;
            months.forEach((m, mIdx) => {
              const pKey = yr + '-' + String(mIdx + 1).padStart(2, '0');
              const item = regionalData.find(r => r.region === reg && r.metric === met && r.period === pKey);
              if (item && item.value !== null) {
                const v = item.value * mult;
                sum += v;
                tr += `<td class="p-1.5 text-right">${formatVal(v, false)}</td>`;
              } else {
                tr += `<td class="p-1.5 text-right text-gray-400">-</td>`;
              }
            });
            tr += `<td class="p-1.5 text-right font-extrabold col-total">${formatVal(sum, false)}</td></tr>`;
            html += tr;
          });
        });
        html += `</tbody></table></div>`;
      });
      html += `</div>`;
      return html;
    }

    // RENDER ANIMAL FATS
    function renderAnimalTab() {
      const mult = currentUnit === 'MT' ? 0.45359237 / 1000.0 * 1000.0 : (currentUnit === 'TONS' ? 1.0 / 2.0 : 1.0);
      const fats = [...new Set(animalData.map(r => r.fat_product))].sort();
      const yearsToRender = [...selectedYears].sort().reverse();

      let html = `<div class="space-y-6">`;
      fats.forEach(fat => {
        const fatRows = animalData.filter(r => r.fat_product === fat);
        const metrics = [...new Set(fatRows.map(r => r.metric))];

        html += `
          <div class="bg-white border-2 border-slate-300 rounded-lg p-3 shadow-sm table-container">
            <h3 class="font-extrabold text-sm mb-2 text-slate-800 px-1">${fat} (${currentUnit})</h3>
            <table class="data-table">
              <colgroup>
                <col style="width: 160px; min-width: 160px;">
                <col class="col-grp">
                ${months.map(() => `<col class="col-mth">`).join('')}
                <col class="col-tot">
              </colgroup>
              <thead>
                <tr class="bg-slate-100 text-slate-800">
                  <th class="text-left font-bold p-1.5 sticky-th-1">Metric</th>
                  <th class="text-left font-bold p-1.5 sticky-th-1">Year</th>
                  ${months.map(m => `<th class="p-1.5 text-center font-bold sticky-th-1">${m}</th>`).join('')}
                  <th class="p-1.5 text-right font-extrabold sticky-th-1 col-total">Total</th>
                </tr>
              </thead>
              <tbody>
        `;
        metrics.forEach(met => {
          yearsToRender.forEach((yr, yIdx) => {
            let tr = `<tr class="hover:bg-slate-50">`;
            if (yIdx === 0) tr += `<td rowspan="${yearsToRender.length}" class="text-left font-bold p-1.5 bg-slate-50 border-r-2 border-slate-400 align-top">${met}</td>`;
            tr += `<td class="text-left font-semibold p-1.5 bg-slate-50/50">${yr}</td>`;

            let sum = 0;
            months.forEach((m, mIdx) => {
              const pKey = yr + '-' + String(mIdx + 1).padStart(2, '0');
              const item = fatRows.find(r => r.metric === met && r.period === pKey);
              if (item && item.value !== null) {
                const v = item.value * mult;
                sum += v;
                tr += `<td class="p-1.5 text-right">${formatVal(v, false)}</td>`;
              } else {
                tr += `<td class="p-1.5 text-right text-gray-400">-</td>`;
              }
            });
            tr += `<td class="p-1.5 text-right font-extrabold col-total">${formatVal(sum, false)}</td></tr>`;
            html += tr;
          });
        });
        html += `</tbody></table></div>`;
      });
      html += `</div>`;
      return html;
    }

    function exportCSV() {
      let csv = 'Group,Attribute,SubAttribute,Year,Month,Value,Unit\n';
      const mult = getUnitMultiplier(false);
      sndData.forEach(r => {
        const rowMult = r.is_percent ? 1.0 : mult;
        const unit = r.is_percent ? '%' : currentUnit;
        Object.entries(r.values).forEach(([p, v]) => {
          if (v !== null && v !== undefined) {
            const yr = p.slice(0, 4);
            const m = monthNumMap[p.slice(5, 7)] || p.slice(5, 7);
            csv += `"${r.group}","${r.attribute}","${r.subattribute}","${yr}","${m}",${v * rowMult},"${unit}"\n`;
          }
        });
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `USDA_OilnFats_SND_${currentUnit}.csv`;
      a.click();
    }

    function render() {
      const container = document.getElementById('content-container');
      if (currentTab === 'SND') {
        container.innerHTML = renderSndTimeline();
      } else if (currentTab === 'SEASON') {
        container.innerHTML = renderSeasonalityTab();
        renderChart();
      } else if (currentTab === 'BO') {
        container.innerHTML = renderCategoryTab('BO');
      } else if (currentTab === 'SBM') {
        container.innerHTML = renderCategoryTab('SBM');
      } else if (currentTab === 'SB') {
        container.innerHTML = renderCategoryTab('SB');
      } else if (currentTab === 'REGIONAL') {
        container.innerHTML = renderRegionalTab();
      } else if (currentTab === 'ANIMAL') {
        container.innerHTML = renderAnimalTab();
      }
    }

    // Init
    initFilters();
    render();
  </script>
</body>
</html>
