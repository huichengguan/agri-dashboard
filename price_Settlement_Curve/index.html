<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSEG Settlement & Forward Term Structure</title>
    <!-- Local Chart.js with CDN Fallback -->
    <script src="chart.umd.min.js"></script>
    <script>
        if (typeof Chart === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>');
        }
    </script>
    <!-- Local html2canvas with CDN Fallback (matching Volatility dashboard) -->
    <script src="html2canvas.min.js"></script>
    <script>
        if (typeof html2canvas === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"><\/script>');
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
:root {
    --bg-base: #f8fafc;
    --bg-surface: #ffffff;
    --bg-card: #ffffff;
    --border-subtle: #e2e8f0;
    --border-focus: #2563eb;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --accent-d1: #2563eb;       /* Date 1: Royal Blue */
    --accent-d2: #d97706;       /* Date 2: Amber */
    --accent-d3: #059669;       /* Date 3: Emerald Green (Live) */
    --accent-rose: #e11d48;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100vh;
    padding-bottom: 80px;
    /* Automatic 80% high-density zoom at 100% browser view */
    zoom: 0.82;
    -moz-transform: scale(0.82);
    -moz-transform-origin: 0 0;
}

/* Header & Sticky Controls */
header {
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 12px 28px;
    box-shadow: var(--shadow-sm);
}

.header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 1920px;
    margin: 0 auto;
    flex-wrap: wrap;
    gap: 14px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-badge {
    background: #2563eb;
    color: #ffffff;
    font-weight: 800;
    font-size: 10.5px;
    padding: 3px 7px;
    border-radius: 5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
}

.brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #0f172a;
}

.brand-subtitle {
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 500;
}

/* Date Controls & Action Buttons */
.controls-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.date-control-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f1f5f9;
    border: 1px solid var(--border-subtle);
    padding: 4px 10px;
    border-radius: 8px;
    flex-wrap: wrap;
}

.date-pill {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.date-label {
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-secondary);
}

.dot-d1 { color: var(--accent-d1); }
.dot-d2 { color: var(--accent-d2); }
.dot-d3 { color: var(--accent-d3); }

.date-input {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 6px;
    border-radius: 5px;
    outline: none;
    transition: all 0.2s;
}

.date-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
}

.btn-update {
    background: #059669;
    color: white;
    border: none;
    padding: 7px 13px;
    border-radius: 7px;
    font-weight: 700;
    font-size: 11.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
}

.btn-update:hover {
    background: #047857;
    transform: translateY(-1px);
}

.btn-outlook {
    background: #0284c7;
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 7px;
    font-weight: 700;
    font-size: 11.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    box-shadow: var(--shadow-sm);
}

.btn-outlook:hover {
    background: #0369a1;
    transform: translateY(-1px);
}

/* Secondary Filter & Navigation Bar */
.filter-nav-bar {
    max-width: 1920px;
    margin: 10px auto 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
}

.category-tabs {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 2px;
}

.tab-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
}

.tab-btn:hover {
    background: #f1f5f9;
    color: var(--text-primary);
}

.tab-btn.active {
    background: #ffffff;
    color: #2563eb;
    border-color: #cbd5e1;
    font-weight: 700;
    box-shadow: var(--shadow-sm);
}

.tab-count {
    font-size: 10.5px;
    background: #e2e8f0;
    color: #475569;
    padding: 1px 5px;
    border-radius: 8px;
    margin-left: 5px;
    font-family: var(--font-mono);
}

.search-box {
    display: flex;
    align-items: center;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    padding: 5px 10px;
    gap: 6px;
    min-width: 240px;
}

.search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 12.5px;
    width: 100%;
}

/* Main Container */
main {
    max-width: 1920px;
    margin: 20px auto 0 auto;
    padding: 0 28px;
    display: flex;
    flex-direction: column;
    gap: 28px;
}

/* Category Section Grouping (No 'Curve' word) */
.category-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.category-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    border: 1px solid var(--border-subtle);
    border-left: 4px solid #2563eb;
    padding: 9px 16px;
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
}

.cat-header-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.2px;
}

.cat-header-meta {
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 600;
    font-family: var(--font-mono);
}

/* Cards Grid */
.curves-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

@media (min-width: 1800px) {
    .curves-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (max-width: 1200px) {
    .curves-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 800px) {
    .curves-grid {
        grid-template-columns: 1fr;
    }
}

/* Compact Curve Card */
.curve-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: var(--shadow-sm);
}

.curve-card:hover {
    border-color: #94a3b8;
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
}

.curve-title-clean {
    font-size: 14px;
    font-weight: 800;
    color: #0f172a;
    display: flex;
    align-items: center;
    gap: 6px;
}

.card-badges {
    display: flex;
    align-items: center;
    gap: 4px;
}

.tag {
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 4px;
    text-transform: uppercase;
    font-family: var(--font-sans);
}

.tag-exchange {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
}

.tag-unit {
    background: #f8fafc;
    color: #64748b;
    border: 1px solid #e2e8f0;
}

.tag-contango {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
}

.tag-backwardation {
    background: #fff1f2;
    color: #be123c;
    border: 1px solid #fecdd3;
}

.tag-flat {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
}

/* Compact Price & Change Segment (Small, Sleek, Minimal Space) */
.kpi-row {
    display: grid;
    grid-template-columns: 1.1fr 1fr 1fr;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 5px;
    padding: 3px 7px;
    font-family: var(--font-mono);
    line-height: 1.2;
}

.kpi-item {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.kpi-caption {
    font-size: 8px;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 700;
    font-family: var(--font-sans);
    letter-spacing: 0.2px;
}

.kpi-value {
    font-size: 11px;
    font-weight: 700;
    color: #0f172a;
}

.kpi-value small {
    font-size: 9px;
    font-weight: 600;
}

.pos { color: #059669 !important; }
.neg { color: #e11d48 !important; }

/* Chart Canvas */
.chart-box {
    height: 175px;
    width: 100%;
    position: relative;
}

/* Footer */
.card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #f1f5f9;
    padding-top: 5px;
    font-size: 10px;
    color: var(--text-muted);
}

.legend-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 9.5px;
    font-family: var(--font-mono);
    font-weight: 600;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 3px;
}

.btn-expand {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #334155;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-expand:hover {
    background: #f1f5f9;
    color: #0f172a;
    border-color: #94a3b8;
}

/* Modal Dialog */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.modal-card {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 14px;
    width: 100%;
    max-width: 1050px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.btn-close {
    background: #f1f5f9;
    border: none;
    color: #64748b;
    font-size: 20px;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-close:hover {
    background: #e2e8f0;
    color: #0f172a;
}

.modal-chart-box {
    height: 360px;
    width: 100%;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 11.5px;
}

.data-table th {
    text-align: right;
    padding: 8px 10px;
    background: #f1f5f9;
    color: #475569;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 10px;
    border-bottom: 2px solid #cbd5e1;
}

.data-table th:first-child, .data-table th:nth-child(2) {
    text-align: left;
}

.data-table td {
    padding: 7px 10px;
    border-bottom: 1px solid #e2e8f0;
    text-align: right;
    color: #0f172a;
}

.data-table td:first-child, .data-table td:nth-child(2) {
    text-align: left;
}

.data-table tr:hover td {
    background: #f8fafc;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.spin-icon {
    animation: spin 1s linear infinite;
}

/* Toast Notification (matching Volatility dashboard) */
.toast-notification {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #0f172a;
    color: #ffffff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.25);
    z-index: 9999;
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.25s ease-out;
    pointer-events: none;
    border: 1px solid #334155;
}

.toast-notification.show {
    opacity: 1;
    transform: translateY(0);
}

    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="brand">
            <span class="brand-badge">LSEG Live</span>
            <div>
                <div class="brand-title">Settlement & Forward Term Structure</div>
                <div class="brand-subtitle">Recreated from Settlement Prices Daily • Powered by LSEG Workspace API</div>
            </div>
        </div>

        <div class="controls-right">
            <!-- 3 Dates Control Bar -->
            <div class="date-control-bar">
                <div class="date-pill">
                    <span class="date-label"><span class="dot-d1">●</span> Date 1</span>
                    <input type="date" id="date1Input" class="date-input" value="2026-10-05">
                </div>
                <div class="date-pill">
                    <span class="date-label"><span class="dot-d2">●</span> Date 2</span>
                    <input type="date" id="date2Input" class="date-input" value="2026-10-30">
                </div>
                <div class="date-pill">
                    <span class="date-label"><span class="dot-d3">●</span> Date 3</span>
                    <input type="date" id="date3Input" class="date-input" value="2026-11-02">
                </div>
                <button class="btn-update" onclick="handleUpdateDates()">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Update Prices
                </button>
            </div>

            <!-- Outlook Classic Snapshot Button (matching Volatility dashboard) -->
            <button class="btn-outlook" id="btn-outlook" onclick="exportToOutlook()" title="Generate Outlook snapshot and open editable draft in Outlook Classic">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                <span>Outlook Snapshot</span>
            </button>
        </div>
    </div>

    <!-- Category Tabs & Quick Filters -->
    <div class="filter-nav-bar">
        <div class="category-tabs" id="categoryTabs">
            <button class="tab-btn active" data-cat="all">All <span class="tab-count" id="countAll">66</span></button>
            <button class="tab-btn" data-cat="Energy">Energy <span class="tab-count">8</span></button>
            <button class="tab-btn" data-cat="Grains & Oilseeds">Grains & Oilseeds <span class="tab-count">26</span></button>
            <button class="tab-btn" data-cat="Livestock & Dairy">Livestock & Dairy <span class="tab-count">4</span></button>
            <button class="tab-btn" data-cat="Softs">Softs <span class="tab-count">9</span></button>
            <button class="tab-btn" data-cat="FX & Rates">FX & Rates <span class="tab-count">14</span></button>
            <button class="tab-btn" data-cat="Metals">Metals <span class="tab-count">5</span></button>
        </div>

        <div class="search-box">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--text-muted)">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="Search commodity, symbol, exchange...">
        </div>
    </div>
</header>

<!-- Main Segregated Category Sections -->
<main id="mainContainer"></main>

<!-- Modal Detail Dialog -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h2 id="modalTitle" style="font-size: 20px; font-weight: 800; color: #0f172a;"></h2>
                <div id="modalMeta" style="font-size: 13px; color: var(--text-muted); margin-top: 4px;"></div>
            </div>
            <button class="btn-close" onclick="closeModal()">&times;</button>
        </div>

        <div class="modal-chart-box">
            <canvas id="modalChartCanvas"></canvas>
        </div>

        <div>
            <h4 style="font-size: 13px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; font-weight: 700;">Contract & Settlement Breakdown</h4>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Contract / Month</th>
                            <th>Instrument RIC</th>
                            <th>Date 1 Settlement</th>
                            <th>Date 2 Settlement</th>
                            <th>Date 3 Live</th>
                            <th>1-Day Δ</th>
                            <th>1-Day %</th>
                            <th>1-Month Δ</th>
                            <th>1-Month %</th>
                        </tr>
                    </thead>
                    <tbody id="modalTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toastNotification" class="toast-notification"></div>

<!-- Embedded Dashboard Logic -->
<script>
let curvesData = null;
let activeCategory = 'all';
let searchQuery = '';
let chartsInstances = {};
let modalChart = null;

// Category Config with 'Curve' word removed from all titles
const CATEGORY_CONFIG = [
    { key: 'Energy', title: 'Energy', icon: '⚡' },
    { key: 'Grains & Oilseeds', title: 'Grains & Oilseeds', icon: '🌾' },
    { key: 'Livestock & Dairy', title: 'Livestock & Dairy', icon: '🥩' },
    { key: 'Softs', title: 'Soft Commodities', icon: '☕' },
    { key: 'FX & Rates', title: 'Foreign Exchange & Interest Rates', icon: '💱' },
    { key: 'Metals', title: 'Metals', icon: '🪙' }
];

function loadCurvesData() {
    if (curvesData) return curvesData;
    const jsonEl = document.getElementById('curvesDataJson');
    if (jsonEl && jsonEl.textContent) {
        try {
            curvesData = JSON.parse(jsonEl.textContent);
            return curvesData;
        } catch (e) {
            console.error('Failed to parse curvesDataJson element:', e);
        }
    }
    if (window.CURVES_DATA) {
        curvesData = window.CURVES_DATA;
        return curvesData;
    }
    return null;
}

function initDashboard() {
    curvesData = loadCurvesData();
    if (!curvesData || !curvesData.curves) {
        console.error('curvesData is missing or invalid.');
        document.getElementById('mainContainer').innerHTML = '<div style="text-align: center; padding: 60px; color: #64748b; font-size: 16px;">Failed to load data. Please refresh or run settlement_engine.py.</div>';
        return;
    }
    renderSegregatedCurves();
    setupEventListeners();
    checkLsegStatus();
}

async function checkLsegStatus() {
    const badge = document.querySelector('.brand-badge');
    if (!badge) return;
    try {
        const resp = await fetch('http://127.0.0.1:8050/api/lseg_status');
        if (resp.ok) {
            const data = await resp.json();
            if (data.lseg_connected) {
                badge.innerHTML = '<span style="color: #10b981; font-size: 13px;">●</span> LSEG LIVE';
                badge.style.borderColor = '#10b981';
                badge.style.color = '#047857';
                badge.style.background = '#ecfdf5';
                badge.title = 'LSEG Workspace desktop session is active and connected';
            } else {
                badge.innerHTML = '<span style="color: #d97706; font-size: 13px;">○</span> LSEG OFFLINE';
                badge.style.borderColor = '#f59e0b';
                badge.style.color = '#b45309';
                badge.style.background = '#fffbeb';
                badge.title = 'Refinitiv / LSEG Workspace is closed on your PC. Please open Workspace and sign in to fetch live prices.';
            }
        }
    } catch (e) {}
}

function renderSegregatedCurves() {
    const main = document.getElementById('mainContainer');
    if (!main) return;
    main.innerHTML = '';

    // Destroy old Chart.js instances to avoid memory leaks
    Object.values(chartsInstances).forEach(ch => {
        try { ch.destroy(); } catch (e) {}
    });
    chartsInstances = {};

    const q = searchQuery.toLowerCase();
    const d1Date = (curvesData.dates && curvesData.dates.date1) ? curvesData.dates.date1.substring(0, 10) : 'Date 1';
    const d2Date = (curvesData.dates && curvesData.dates.date2) ? curvesData.dates.date2.substring(0, 10) : 'Date 2';
    const d3Date = (curvesData.dates && curvesData.dates.date3) ? curvesData.dates.date3.substring(0, 10) : 'Date 3';

    CATEGORY_CONFIG.forEach(cat => {
        if (activeCategory !== 'all' && activeCategory !== cat.key) return;

        const catCurves = curvesData.curves.filter(c => {
            if (c.category !== cat.key) return false;
            if (!q) return true;
            return c.title.toLowerCase().includes(q) || 
                   (c.exchange && c.exchange.toLowerCase().includes(q)) ||
                   (c.sheet && c.sheet.toLowerCase().includes(q)) ||
                   c.points.some(p => p.ric && p.ric.toLowerCase().includes(q));
        });

        if (catCurves.length === 0) return;

        // Section Container
        const section = document.createElement('section');
        section.className = 'category-section';
        section.id = 'section_' + cat.key.replace(/\s+/g, '_');

        section.innerHTML = `
            <div class="category-section-header">
                <div class="cat-header-title">
                    <span>${cat.icon}</span>
                    <span>${cat.title}</span>
                </div>
                <div class="cat-header-meta">${catCurves.length} Markets Active</div>
            </div>
            <div class="curves-grid" id="grid_${cat.key.replace(/\s+/g, '_')}"></div>
        `;

        main.appendChild(section);
        const grid = section.querySelector('.curves-grid');

        catCurves.forEach(c => {
            const card = document.createElement('div');
            card.className = 'curve-card';
            card.id = `card_${c.id}`;

            const m = c.metrics || {};
            const chg1dStr = (m.change_1d !== null && m.change_1d !== undefined) ? (m.change_1d > 0 ? `+${m.change_1d}` : `${m.change_1d}`) : '--';
            const chg1dPctStr = (m.change_1d_pct !== null && m.change_1d_pct !== undefined) ? (m.change_1d_pct > 0 ? `(+${m.change_1d_pct}%)` : `(${m.change_1d_pct}%)`) : '';
            const chg1dClass = m.change_1d > 0 ? 'pos' : (m.change_1d < 0 ? 'neg' : '');

            const chg1mStr = (m.change_1m !== null && m.change_1m !== undefined) ? (m.change_1m > 0 ? `+${m.change_1m}` : `${m.change_1m}`) : '--';
            const chg1mPctStr = (m.change_1m_pct !== null && m.change_1m_pct !== undefined) ? (m.change_1m_pct > 0 ? `(+${m.change_1m_pct}%)` : `(${m.change_1m_pct}%)`) : '';
            const chg1mClass = m.change_1m > 0 ? 'pos' : (m.change_1m < 0 ? 'neg' : '');

            let structTag = 'tag-flat';
            if (m.structure === 'Contango') structTag = 'tag-contango';
            if (m.structure === 'Backwardation') structTag = 'tag-backwardation';

            card.innerHTML = `
                <div class="card-header">
                    <div class="curve-title-clean">
                        <span>${c.title}</span>
                    </div>
                    <div class="card-badges">
                        ${c.exchange ? `<span class="tag tag-exchange">${c.exchange}</span>` : ''}
                        ${c.unit ? `<span class="tag tag-unit">${c.unit}</span>` : ''}
                        <span class="tag ${structTag}">${m.structure || 'Flat'}</span>
                        <button class="btn-expand" onclick="openModal('${c.id}')">Details</button>
                    </div>
                </div>

                <div class="kpi-row">
                    <div class="kpi-item">
                        <span class="kpi-caption">Active: ${m.active_contract || 'Prompt'}</span>
                        <span class="kpi-value">${(m.prompt_price !== null && m.prompt_price !== undefined) ? m.prompt_price : '--'}</span>
                    </div>
                    <div class="kpi-item" style="text-align: right;">
                        <span class="kpi-caption">1D Change</span>
                        <span class="kpi-value ${chg1dClass}">${chg1dStr} <small style="font-size: 9.5px;">${chg1dPctStr}</small></span>
                    </div>
                    <div class="kpi-item" style="text-align: right;">
                        <span class="kpi-caption">1M Change</span>
                        <span class="kpi-value ${chg1mClass}">${chg1mStr} <small style="font-size: 9.5px;">${chg1mPctStr}</small></span>
                    </div>
                </div>

                <div class="chart-box">
                    <canvas id="canvas_${c.id}"></canvas>
                </div>

                <div class="card-footer">
                    <div class="legend-inline">
                        <span class="legend-item"><span class="dot-d1">--</span> ${d1Date}</span>
                        <span class="legend-item"><span class="dot-d2">―</span> ${d2Date}</span>
                        <span class="legend-item"><span class="dot-d3">―</span> ${d3Date}</span>
                    </div>
                    <span>${c.points.length} tenors</span>
                </div>
            `;

            grid.appendChild(card);
            renderMiniChart(c);
        });
    });

    if (main.children.length === 0) {
        main.innerHTML = '<div style="text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px;">No markets found matching your filter criteria.</div>';
    }
}

function isFxTenorUpTo1Y(lbl) {
    if (!lbl || !String(lbl).trim()) return false;
    const l = String(lbl).trim().toUpperCase();
    if (l.endsWith('Y')) {
        const y = parseFloat(l.slice(0, -1));
        return !isNaN(y) && y <= 1.0;
    }
    return true;
}

function renderMiniChart(c) {
    if (typeof Chart === 'undefined') {
        console.warn('Chart.js not loaded yet for', c.id);
        return;
    }
    const canvas = document.getElementById(`canvas_${c.id}`);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    let pts = c.points;
    if (c.category === 'FX & Rates' && c.id !== 'curve_61') {
        pts = pts.filter(p => isFxTenorUpTo1Y(p.display_label || p.contract_code || p.label));
    }

    const labels = pts.map(p => p.display_label || p.contract_code || p.label || p.ric);
    const d1Vals = pts.map(p => p.v1);
    const d2Vals = pts.map(p => p.v2);
    const d3Vals = pts.map(p => p.v3);

    const d1Date = (curvesData.dates && curvesData.dates.date1) ? curvesData.dates.date1.substring(0, 10) : 'Date 1';
    const d2Date = (curvesData.dates && curvesData.dates.date2) ? curvesData.dates.date2.substring(0, 10) : 'Date 2';
    const d3Date = (curvesData.dates && curvesData.dates.date3) ? curvesData.dates.date3.substring(0, 10) : 'Date 3';

    chartsInstances[c.id] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                {
                    label: d1Date,
                    data: d1Vals,
                    borderColor: '#2563eb',
                    borderWidth: 1.5,
                    borderDash: [4, 4],
                    pointRadius: 2.5,
                    pointBackgroundColor: '#2563eb',
                    tension: 0.15,
                    spanGaps: true
                },
                {
                    label: d2Date,
                    data: d2Vals,
                    borderColor: '#d97706',
                    borderWidth: 1.8,
                    pointRadius: 3,
                    pointBackgroundColor: '#d97706',
                    tension: 0.15,
                    spanGaps: true
                },
                {
                    label: d3Date,
                    data: d3Vals,
                    borderColor: '#059669',
                    borderWidth: 2.5,
                    pointRadius: 3.5,
                    pointBackgroundColor: '#059669',
                    pointBorderColor: '#ffffff',
                    tension: 0.15,
                    spanGaps: true
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(15, 23, 42, 0.95)',
                    titleColor: '#ffffff',
                    bodyColor: '#cbd5e1',
                    borderColor: '#cbd5e1',
                    borderWidth: 1,
                    padding: 8,
                    displayColors: true,
                    callbacks: {
                        title: function(items) {
                            const idx = items[0].dataIndex;
                            const pt = c.points[idx];
                            return `${pt.display_label || pt.label} (${pt.ric || ''})`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { color: '#f1f5f9' },
                    ticks: {
                        color: '#64748b',
                        font: { size: 9, family: "'JetBrains Mono', monospace" },
                        maxRotation: 45
                    }
                },
                y: {
                    grid: { color: '#f1f5f9' },
                    ticks: {
                        color: '#64748b',
                        font: { size: 9, family: "'JetBrains Mono', monospace" }
                    }
                }
            }
        }
    });
}

function openModal(curveId) {
    const c = curvesData.curves.find(x => x.id === curveId);
    if (!c) return;

    document.getElementById('modalTitle').innerText = c.title;
    document.getElementById('modalMeta').innerText = `${c.category} • ${c.exchange || ''} • ${c.description || ''} (${c.unit || ''})`;

    const tbody = document.getElementById('modalTableBody');
    tbody.innerHTML = '';

    let pts = c.points;
    if (c.category === 'FX & Rates' && c.id !== 'curve_61') {
        pts = pts.filter(p => isFxTenorUpTo1Y(p.display_label || p.contract_code || p.label));
    }

    pts.forEach(p => {
        const v1 = (p.v1 !== null && p.v1 !== undefined) ? p.v1 : '--';
        const v2 = (p.v2 !== null && p.v2 !== undefined) ? p.v2 : '--';
        const v3 = (p.v3 !== null && p.v3 !== undefined) ? p.v3 : '--';

        let diff1d = '--', diff1dPct = '', diff1dClass = '';
        if (p.v3 !== null && p.v3 !== undefined && p.v2 !== null && p.v2 !== undefined) {
            const d = Math.round((p.v3 - p.v2) * 10000) / 10000;
            diff1d = d > 0 ? `+${d}` : `${d}`;
            diff1dClass = d > 0 ? 'pos' : (d < 0 ? 'neg' : '');
            if (p.v2 !== 0) {
                const pct = Math.round(((d / p.v2) * 100) * 100) / 100;
                diff1dPct = pct > 0 ? `(+${pct}%)` : `(${pct}%)`;
            }
        }

        let diff1m = '--', diff1mPct = '', diff1mClass = '';
        if (p.v3 !== null && p.v3 !== undefined && p.v1 !== null && p.v1 !== undefined) {
            const d = Math.round((p.v3 - p.v1) * 10000) / 10000;
            diff1m = d > 0 ? `+${d}` : `${d}`;
            diff1mClass = d > 0 ? 'pos' : (d < 0 ? 'neg' : '');
            if (p.v1 !== 0) {
                const pct = Math.round(((d / p.v1) * 100) * 100) / 100;
                diff1mPct = pct > 0 ? `(+${pct}%)` : `(${pct}%)`;
            }
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${p.display_label || p.label}</strong></td>
            <td style="color: #2563eb;">${p.ric || '--'}</td>
            <td>${v1}</td>
            <td>${v2}</td>
            <td style="font-weight: 700;">${v3}</td>
            <td class="${diff1dClass}">${diff1d}</td>
            <td class="${diff1dClass}">${diff1dPct}</td>
            <td class="${diff1mClass}">${diff1m}</td>
            <td class="${diff1mClass}">${diff1mPct}</td>
        `;
        tbody.appendChild(tr);
    });

    if (modalChart) {
        try { modalChart.destroy(); } catch (e) {}
    }
    const canvas = document.getElementById('modalChartCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const labels = pts.map(p => p.display_label || p.label || p.ric);
    const d1Vals = pts.map(p => p.v1);
    const d2Vals = pts.map(p => p.v2);
    const d3Vals = pts.map(p => p.v3);

    const d1Date = (curvesData.dates && curvesData.dates.date1) ? curvesData.dates.date1.substring(0, 10) : 'Date 1';
    const d2Date = (curvesData.dates && curvesData.dates.date2) ? curvesData.dates.date2.substring(0, 10) : 'Date 2';

async function handleUpdateDates() {
    const d1 = document.getElementById('date1Input').value;
    const d2 = document.getElementById('date2Input').value;
    const d3 = document.getElementById('date3Input').value;

    if (!d1 || !d2 || !d3) {
        showToast('Please select all 3 dates.');
        return;
    }

    const btn = document.querySelector('.btn-update');
    const origHTML = btn.innerHTML;
    btn.innerHTML = `
        <svg class="spin-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Updating LSEG...</span>
    `;
    btn.style.opacity = '0.7';
    btn.disabled = true;

    showToast(`Querying LSEG Workspace for ${d1}, ${d2}, ${d3}...`, 8000);

    const apiBase = window.location.protocol === 'file:' ? 'http://127.0.0.1:8050' : '';
    let success = false;

    // 1. Try local HTTP server first
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000);
        const resp = await fetch(apiBase + '/api/fetch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ date1: d1, date2: d2, date3: d3 }),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (resp.ok) {
            const res = await resp.json();
            curvesData = res;
            renderSegregatedCurves();
            showToast(`✓ Successfully updated 66 markets from LSEG Workspace for ${d1}, ${d2}, ${d3}!`, 5000);
            checkLsegStatus();
            success = true;
        } else if (resp.status === 503) {
            const errData = await resp.json();
            showToast(`⚠️ ${errData.message || 'LSEG Workspace is closed. Please open Refinitiv Workspace on your PC and click Update Prices.'}`, 9000);
            checkLsegStatus();
            btn.innerHTML = origHTML;
            btn.style.opacity = '1';
            btn.disabled = false;
            return;
        }
    } catch (err) {
        // Server might be offline; fall back to background protocol handler
    }

    // 2. If server was offline, trigger Windows background updater protocol silently
    if (!success) {
        try {
            showToast('Launching background LSEG updater... Fetching 66 markets...', 10000);
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = `lseg-update://update?d1=${encodeURIComponent(d1)}&d2=${encodeURIComponent(d2)}&d3=${encodeURIComponent(d3)}`;
            document.body.appendChild(iframe);
            setTimeout(() => { try { iframe.remove(); } catch (e) {} }, 3000);

            // Poll for completion up to 45 seconds
            const startTime = Date.now();
            while (Date.now() - startTime < 45000) {
                await new Promise(r => setTimeout(r, 2000));
                try {
                    const checkResp = await fetch('http://127.0.0.1:8050/api/curves');
                    if (checkResp.ok) {
                        const checkData = await checkResp.json();
                        const curDates = checkData.dates || {};
                        if (curDates.date1 === d1 && curDates.date2 === d2 && curDates.date3 === d3) {
                            curvesData = checkData;
                            renderSegregatedCurves();
                            showToast(`✓ Successfully updated 66 markets from LSEG Workspace for ${d1}, ${d2}, ${d3}!`, 5000);
                            success = true;
                            break;
                        }
                    }
                } catch (e) {
                    // Server still starting up
                }
            }
            if (!success) {
                showToast('LSEG update in progress. Dashboard will refresh shortly.', 5000);
            }
        } catch (e) {
            showToast('Unable to start background updater: ' + e.message, 5000);
        }
    }

    btn.innerHTML = origHTML;
    btn.style.opacity = '1';
    btn.disabled = false;
}

function showToast(message, duration = 4500) {
    let toast = document.getElementById('toastNotification');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toastNotification';
        toast.className = 'toast-notification';
        document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, duration);
}

function getYYMMDDSubject() {
    let d3 = (curvesData && curvesData.dates && curvesData.dates.date3) ? curvesData.dates.date3.substring(0, 10) : '';
    if (d3) {
        const parts = d3.split('-');
        if (parts.length === 3) {
            return parts[0].substring(2) + parts[1] + parts[2] + ' Daily Curve';
        }
    }
    const now = new Date();
    const yy = String(now.getFullYear()).substring(2);
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    return yy + mm + dd + ' Daily Curve';
}

function generateEmlBlob(base64Png, subject) {
    const boundary = "----=_Part_Snap_" + Math.random().toString(36).substring(2);
    const cleanB64 = base64Png.replace(/^data:image\/png;base64,/, '');
    const wrappedB64 = cleanB64.match(/.{1,76}/g).join('\r\n');

    const eml = 
`X-Unsent: 1\r
Subject: ${subject}\r
MIME-Version: 1.0\r
Content-Type: multipart/related; boundary="${boundary}"\r
\r
--${boundary}\r
Content-Type: text/html; charset="utf-8"\r
Content-Transfer-Encoding: 7bit\r
\r
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
  <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="width: 100%; background-color: #f1f5f9; margin: 0; padding: 12px 0;">
    <tr>
      <td align="center" style="padding: 0 8px;">
        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="max-width: 1600px; width: 100%; background-color: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px;">
          <tr>
            <td align="center" style="padding: 0;">
              <img src="cid:dashboard_snapshot" alt="${subject}" width="100%" style="width: 100%; max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 6px;" />
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>\r
\r
--${boundary}\r
Content-Type: image/png; name="Settlement_Dashboard.png"\r
Content-Transfer-Encoding: base64\r
Content-ID: <dashboard_snapshot>\r
Content-Disposition: inline; filename="Settlement_Dashboard.png"\r
\r
${wrappedB64}\r
\r
--${boundary}--\r
`;
    return new Blob([eml], { type: 'message/rfc822' });
}

async function exportToOutlook() {
    const btn = document.getElementById('btn-outlook') || document.querySelector('.btn-outlook');
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `
        <svg class="spin-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <span>Opening Outlook Classic...</span>
    `;

    const subject = getYYMMDDSubject();
    let opened = false;

    // 1. Try local HTTP dispatcher service first (port 8050)
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2000);
        const resp = await fetch('http://127.0.0.1:8050/open_outlook', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject: subject }),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (resp.ok) {
            opened = true;
            showToast(`Draft created in Outlook Classic: ${subject} (Send button enabled)!`);
        }
    } catch (e) {
        // Local HTTP service offline or slow; fall back to protocol handler
    }

    // 2. If HTTP service is offline, trigger registered Windows OS protocol handler directly
    // This directly executes outlook_draft_generator.py via pythonw.exe into Outlook Classic
    if (!opened) {
        try {
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = 'lseg-outlook:draft';
            document.body.appendChild(iframe);
            setTimeout(() => {
                try { iframe.remove(); } catch (e) {}
            }, 3000);
            opened = true;
            showToast(`Opening Outlook Classic: ${subject}...`);
        } catch (e) {
            console.error('Protocol handler error:', e);
        }
    }

    // 3. Simultaneously copy snapshot image to clipboard for convenient pasting
    try {
        const container = document.getElementById('mainContainer');
        if (typeof html2canvas !== 'undefined' && container) {
            html2canvas(container, {
                scale: 1.2,
                useCORS: true,
                logging: false,
                backgroundColor: '#f8fafc'
            }).then(canvas => {
                canvas.toBlob(async (blob) => {
                    if (blob && navigator.clipboard && navigator.clipboard.write) {
                        try {
                            await navigator.clipboard.write([
                                new ClipboardItem({ 'image/png': blob })
                            ]);
                        } catch (err) {}
                    }
                }, 'image/png');
            }).catch(() => {});
        }
    } catch (e) {}

    setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
    }, 2500);
}
